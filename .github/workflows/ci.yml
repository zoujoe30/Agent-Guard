name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run self-tests
        run: ./test.sh
      - name: Build all release products
        run: swift build -c release
